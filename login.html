<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Kumawat Enterprises</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
    <div class="login-card">
        <button id="themeToggleBtn" class="theme-toggle" onclick="toggleTheme()" style="position:absolute; top:16px; right:16px;">🌙 Dark</button>

        <div class="login-eyebrow">
            <div class="login-mark">K</div>
            <span>KUMAWAT ENTERPRISES</span>
        </div>
        <div class="login-icon-light">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
                <path d="M6 2H14L19 7V22H6V2Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M14 2V7H19" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M9 12H16M9 15.5H16M9 9H12" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
        </div>

        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Sign in to manage your invoices</p>

        <div class="login-field">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username">
        </div>
        <div class="login-field">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button onclick="login()" class="login-btn">Login</button>
        <p id="loginError" class="login-error"></p>
        <p class="login-foot">Powering industries with trust and tech</p>
    </div>

    <script src="config.js"></script>
    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.querySelector('.login-btn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Logging in...';
            document.getElementById('loginError').textContent = '';
            try {
                const res = await fetch(API_BASE + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('loginError').textContent = data.error;
                    btn.disabled = false;
                    btn.textContent = originalText;
                }
            } catch (err) {
                document.getElementById('loginError').textContent = 'Could not reach server. Please try again.';
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
