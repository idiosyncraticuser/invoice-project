<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Kumawat Enterprises</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <img src="Black & Blue Minimalist Modern Initial Font Logo.png" alt="Logo" class="header-logo" />
            <div>
                <h1>Kumawat Enterprises</h1>
                <p class="tagline">Powering Industries with Trust & Tech</p>
            </div>
        </div>
        <div class="header-actions">
            <button id="themeToggleBtn" class="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
            <a href="index.html">+ New Invoice</a>
            <a href="history.html">View History</a>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container-main">
        <h2>Dashboard <span>Insights</span></h2>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Invoices</div>
                <div class="stat-value" id="statTotalInvoices">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Revenue</div>
                <div class="stat-value">₹<span id="statTotalRevenue">-</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Invoices This Month</div>
                <div class="stat-value" id="statMonthInvoices">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Revenue This Month</div>
                <div class="stat-value">₹<span id="statMonthRevenue">-</span></div>
            </div>
        </div>

        <div class="chart-container">
            <h4>Monthly Revenue</h4>
            <canvas id="monthlyChart"></canvas>
        </div>

        <div class="chart-container">
            <h4>Top 5 Clients by Revenue</h4>
            <canvas id="clientsChart"></canvas>
        </div>

        <p id="dashboardStatus"></p>
    </div>
    <script src="theme.js"></script>
    <script src="config.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        async function loadDashboard() {
            const statusEl = document.getElementById('dashboardStatus');
            statusEl.textContent = 'Loading insights...';

            try {
                const res = await fetch(API_BASE + '/api/invoices/stats', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const stats = await res.json();

                if (!res.ok) {
                    statusEl.textContent = 'Could not load dashboard: ' + stats.error;
                    return;
                }

                statusEl.textContent = '';
                document.getElementById('statTotalInvoices').textContent = stats.totalInvoices;
                document.getElementById('statTotalRevenue').textContent = stats.totalRevenue.toFixed(2);
                document.getElementById('statMonthInvoices').textContent = stats.thisMonthInvoices;
                document.getElementById('statMonthRevenue').textContent = stats.thisMonthRevenue.toFixed(2);

                new Chart(document.getElementById('monthlyChart'), {
                    type: 'bar',
                    data: {
                        labels: stats.monthlyRevenue.map(m => m.month),
                        datasets: [{
                            label: 'Revenue (₹)',
                            data: stats.monthlyRevenue.map(m => m.revenue),
                            backgroundColor: '#007bff'
                        }]
                    },
                    options: { responsive: true }
                });

                new Chart(document.getElementById('clientsChart'), {
                    type: 'bar',
                    data: {
                        labels: stats.topClients.map(c => c.name),
                        datasets: [{
                            label: 'Revenue (₹)',
                            data: stats.topClients.map(c => c.revenue),
                            backgroundColor: '#28a745'
                        }]
                    },
                    options: { responsive: true, indexAxis: 'y' }
                });

            } catch (err) {
                statusEl.textContent = 'Could not reach server. Please check your connection.';
                console.error('Dashboard load failed:', err);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
